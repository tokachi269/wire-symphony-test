name: Agent investigation
description: 曖昧な課題や未実装範囲をread-onlyで調査し、根拠のあるIssueへ分解する
title: "[Agent investigate] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        OWNER、MEMBER、COLLABORATORがこのフォームを送信すると、read-onlyの調査queueへ入ります。調査agentはコードを変更せず、確認できた事実から具体的な実装Issueを作ります。
  - type: textarea
    id: question
    attributes:
      label: Investigation question
      description: 調べたい領域、未実装と思われる範囲、判断したいことを書く
      placeholder: roadの未実装operationと既存contractの対応を調査し、実装可能な単位へ整理する
    validations:
      required: true
  - type: textarea
    id: current_evidence
    attributes:
      label: Current evidence
      description: 現時点で確認済みの事実、ログ、対象ファイル、関連Issueやcommitを書く
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: 調査とIssue分解を許可する領域を書く
    validations:
      required: true
  - type: textarea
    id: out_of_scope
    attributes:
      label: Out of scope
      description: 調査対象外、作成してはいけないIssue、外部操作を書く
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: Canonical references
      description: architecture、operation semantics、testing文書などを指定する
      placeholder: |
        docs/architecture.md
        docs/testing.md
  - type: dropdown
    id: issue_handling
    attributes:
      label: Generated issue handling
      description: 調査から作成した実装Issueをどう扱うか選ぶ
      options:
        - Create and queue independent issues automatically
        - Create proposed issues without running them
        - Report only; do not create issues
    validations:
      required: true
  - type: checkboxes
    id: authorize
    attributes:
      label: Authorization
      options:
        - label: I authorize this agent to inspect the repository and create issues only inside the scope above.
          required: true
