name: Symphony plan or review
description: Solを必要な設計判断・レビューだけに限定して使う
title: "[Symphony review] "
labels:
  - symphony-sol-review
body:
  - type: markdown
    attributes:
      value: |
        このIssueはSol Highのread-onlyキューに入ります。実装は行わず、設計方針またはレビュー結果だけをIssueへ返します。
  - type: dropdown
    id: review_kind
    attributes:
      label: Review kind
      options:
        - Pre-implementation design
        - Post-implementation code review
    validations:
      required: true
  - type: textarea
    id: question
    attributes:
      label: Decision or review question
      description: Solでなければ判断しにくい問いを1つに絞る
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence to inspect
      description: commit hash、diff、対象ファイル、再現結果、正本文書を指定する
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Constraints and out of scope
      description: 守る不変条件と検討対象外を書く
    validations:
      required: true
  - type: textarea
    id: expected_output
    attributes:
      label: Expected output
      description: 必要な判断、findings、次の実装Issueに渡す内容を書く
    validations:
      required: true
