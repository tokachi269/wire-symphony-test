name: Agent implementation
description: 隔離workspaceで実装・検証し、Draft PRを独立レビューへ渡す
title: "[Agent implement] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        OWNER、MEMBER、COLLABORATORがこのフォームから登録したIssueだけが、自動的に実装キューへ入ります。未決定事項を実装させず、1 Issueを独立して検証できる大きさにしてください。
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: 完了時に成立している状態を具体的に書く
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Current evidence
      description: 再現条件、ログ、対象ファイル、関連commitなど、確認済みの事実を書く
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: 必須の検証結果をチェック可能な形で書く
      placeholder: |
        - [ ] focused testがfail-firstからpassになる
        - [ ] 関連する既存testがpassする
        - [ ] Draft PRが作成され、独立レビューへ渡される
    validations:
      required: true
  - type: textarea
    id: out_of_scope
    attributes:
      label: Out of scope
      description: 今回変更してはいけない領域や判断を書く
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: Canonical references
      description: 読むべきarchitecture、operation semantics、testing文書などを書く
      placeholder: docs/testing.md
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: その他の制約。秘密情報は書かない
